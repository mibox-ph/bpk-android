<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BPK Staff</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#1b2330;--mute:#5b6577;--line:#d9e1ee;--blue:#1d5fd0;--blue2:#e6eefb;--green:#1f9d55;--green2:#e3f5ea;--yellow:#f2c200;--orange:#f08a00;--red:#d93025;--red2:#fdecea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;overflow:hidden}
body.kitchen{background:#10151d;color:#eef2f8}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;min-height:48px;padding:0 16px;background:var(--blue);color:#fff;font-weight:700}
button.sec{background:var(--blue2);color:var(--blue)}
button.gray{background:#e8ecf3;color:var(--ink)}
button.red{background:var(--red)}
button.green{background:var(--green)}
button:disabled{opacity:.45}
input,textarea{font:inherit;width:100%;min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#12294a;color:#fff;flex:none}
.top b{font-size:18px}.top .sp{flex:1}
.top button{min-height:40px;padding:0 12px;background:#274b82;font-size:14px}
.top button.on{background:#fff;color:#12294a}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green)}.dot.off{background:var(--red)}
.main{flex:1;overflow:auto;padding:12px}
.pad{max-width:420px;margin:0 auto}
.login h1{text-align:center;margin:18px 0 4px}.login p{text-align:center;color:var(--mute);margin:0 0 16px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.names button{min-height:64px;background:#fff;color:var(--ink);border:2px solid var(--line);font-size:18px}
.names button small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.dots{display:flex;justify-content:center;gap:12px;margin:14px 0;min-height:20px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line)}.dots i.f{background:var(--blue)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{min-height:62px;font-size:24px;background:#fff;color:var(--ink);border:1px solid var(--line)}
.err{color:var(--red);text-align:center;min-height:22px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.tb{background:var(--card);border:2px solid var(--line);border-radius:14px;min-height:96px;padding:8px;text-align:center;color:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:2px}
.tb .n{font-size:30px;font-weight:800}.tb small{color:var(--mute)}
.tb.busy{background:var(--blue2);border-color:#9db9ea}
.tb.mine{border-color:var(--blue)}
.tb.ready{background:var(--green2);border-color:var(--green);animation:pulse 1s infinite}
.tb.bill{border-color:var(--yellow)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:800;color:#fff;background:var(--green)}
.tag.y{background:#b58900}.tag.r{background:var(--red)}.tag.b{background:var(--blue)}.tag.g{background:#6b7588}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(31,157,85,.25)}}
@keyframes blink{50%{opacity:.35}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}.row .sp{flex:1}
.h2{font-size:18px;font-weight:800;margin:0}
.mute{color:var(--mute)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btns button{flex:1;min-width:120px}
.line{padding:8px 0;border-top:1px solid var(--line)}.line:first-child{border-top:0}
.line.void{opacity:.55;text-decoration:line-through}
.sub{font-size:13px;color:var(--mute)}
/* compose */
.cmp{display:grid;grid-template-columns:120px 1fr;height:100%;gap:0}
.rail{overflow:auto;background:#fff;border-right:1px solid var(--line)}
.rail button{display:block;width:100%;min-height:56px;border-radius:0;background:#fff;color:var(--ink);text-align:left;font-size:14px;padding:6px 10px;border-bottom:1px solid var(--line);font-weight:600}
.rail button.on{background:var(--blue);color:#fff}
.mid{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:hidden;min-width:0}
.items{overflow:auto;padding:8px}
.it{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin-bottom:8px;min-height:60px;border-radius:12px;padding:8px 12px;font-weight:600}
.it .p{margin-left:auto;color:var(--blue);white-space:nowrap}
.it.out{opacity:.45}
.cmpwrap{display:grid;grid-template-columns:1fr;height:100%;position:relative}
@media(min-width:900px){.cmpwrap{grid-template-columns:1fr 330px}.cartbtn{display:none}.cart{position:static!important;transform:none!important}}
.cart{position:absolute;inset:0;background:#fff;z-index:5;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .2s;border-left:1px solid var(--line)}
.cart.open{transform:none}
.cart .body{flex:1;overflow:auto;padding:10px}
.cart .foot{padding:10px;border-top:1px solid var(--line)}
.cartbtn{position:absolute;left:130px;right:10px;bottom:10px;z-index:4;min-height:54px;font-size:17px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{min-width:44px;padding:0;background:#e8ecf3;color:var(--ink);font-size:22px}
.qty span{min-width:28px;text-align:center;font-weight:800;font-size:18px}
.chk{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chk label{flex:1;min-width:100px;border:2px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-weight:700;background:#fff}
.chk input{display:none}.chk input:checked+span{color:var(--red)}
.chk label:has(input:checked){border-color:var(--red);background:var(--red2)}
.vopt{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff;font-weight:600}
.vopt:has(input:checked){border-color:var(--blue);background:var(--blue2)}
.vopt input{width:20px;min-height:20px;flex:none}
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(10,20,40,.55);align-items:center;justify-content:center;padding:12px}
#modal.show{display:flex}
.sheet{background:#fff;color:var(--ink);border-radius:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:16px}
#alerts{position:fixed;left:0;right:0;top:0;z-index:40;pointer-events:none}
#alerts>*{pointer-events:auto}
.banner{margin:6px;padding:12px;border-radius:12px;background:var(--green);color:#fff;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.banner b{font-size:17px}.banner .sp{flex:1}
.banner button{background:#fff;color:var(--green)}
.svc{position:fixed;inset:0;z-index:60;background:var(--red);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:blink 1s infinite;text-align:center;padding:20px}
.svc h1{font-size:64px;margin:0}.svc button{background:#fff;color:var(--red);font-size:24px;min-height:72px;padding:0 40px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;background:#1b2330;color:#fff;padding:12px 18px;border-radius:12px;display:none;max-width:90%;text-align:center}
/* kitchen */
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.tk{background:#1b2431;border-radius:14px;border-top:10px solid var(--green);padding:10px;color:#eef2f8}
.tk.c-y{border-top-color:var(--yellow)}.tk.c-o{border-top-color:var(--orange)}.tk.c-r{border-top-color:var(--red)}
.tk.blink{animation:blink 1s infinite}
.tk.rdy{border-top-color:#5b6b85;opacity:.7}
.tk .hd{display:flex;align-items:baseline;gap:8px}.tk .hd b{font-size:26px}.tk .tm{margin-left:auto;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.tk .li{padding:6px 0;border-top:1px solid #2c3a4f;font-size:18px}
.tk .li small{display:block;color:#aeb9cc;font-size:14px}
.tk button{width:100%;margin-top:8px;min-height:54px}
.vb{background:var(--red);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.vb .sp{flex:1}.vb button{background:#fff;color:var(--red);min-height:44px}
.kt{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.kt .sp{flex:1}
.svbtn{background:#f08a00;font-size:20px;min-height:56px}
#pttbar{position:fixed;right:12px;bottom:84px;z-index:30;display:none;flex-direction:column;gap:10px;align-items:flex-end}
#pttbar button{border-radius:50%;width:72px;height:72px;min-height:72px;padding:0;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none}
#pttbar .quick{width:52px;height:52px;min-height:52px;font-size:22px;background:#274b82}
#pttbar .mic{background:#d93025}
#pttbar .mic.rec{background:#7a0f0a;animation:blink 1s infinite}
#pttbar .lbl{background:#12294a;color:#fff;border-radius:10px;padding:4px 10px;font-size:13px;display:none}
#recov{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:45;background:#12294aee;color:#fff;border-radius:16px;padding:18px 22px;text-align:center;display:none;min-width:240px}
#recov b{font-size:34px;display:block;font-variant-numeric:tabular-nums}
#vmsg{position:fixed;left:8px;right:96px;bottom:84px;z-index:35;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#vmsg>div{pointer-events:auto;background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;border-left:8px solid var(--blue);max-width:460px}
#vmsg button{min-height:40px;padding:0 12px}
/* ---- revision 24 ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;align-items:start}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;margin:0}
.tile.bill{border:2px solid var(--yellow)}
.tile .tt{display:flex;align-items:center;gap:6px}.tile .tt b{font-size:16px;line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .its{font-size:13px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.tile .btns{margin-top:6px;gap:6px}.tile .btns button{min-height:40px;min-width:0;font-size:14px;padding:0 8px}
.tile .line{padding:3px 0;font-size:14px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tb2{border:3px solid rgba(0,0,0,.18);border-radius:16px;min-height:140px;padding:10px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;text-align:center}
.tb2 .n{font-size:44px;font-weight:800;line-height:1}.tb2 .w{font-size:13px;font-weight:800;letter-spacing:1px}.tb2 small{font-size:13px;opacity:.95}
.tb2.free{background:#1f9d55}.tb2.occ{background:#d93025}.tb2.rsv{background:#f2c200;color:#3b2f00}.tb2.adv{background:#f08a00}
.tb2.mine{outline:4px solid var(--blue);outline-offset:2px}.tb2.ready{animation:pulse 1s infinite}
.tb2 .tag{background:rgba(0,0,0,.35)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:13px}.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.rail{display:flex;flex-direction:column;overflow:hidden;width:150px}
.rail button{flex:1 1 0;min-height:30px;padding:2px 10px;font-size:clamp(11px,1.7vh,15px);display:flex;align-items:center}
.cmp{grid-template-columns:150px 1fr;grid-template-rows:minmax(0,1fr)}.mid{min-height:0}.cmpwrap{grid-template-rows:minmax(0,1fr)}
.items{grid-auto-rows:max-content;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start}
.it{flex-direction:column;align-items:stretch;gap:0;padding:0;margin:0;min-height:0;overflow:hidden;position:relative;text-align:left}
.it img,.it .ph{width:100%;aspect-ratio:4/3;object-fit:cover;background:#e8ecf3;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px;font-weight:400}
.it .nm{padding:6px 8px 0;font-size:14px;line-height:1.25}.it .p{margin:0;padding:0 8px 8px;font-size:15px}
.it .bd{position:absolute;top:6px;left:6px}
@media(min-width:900px){.cmpwrap{grid-template-columns:1fr 420px}}
.cartbtn{left:160px}
.kb{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.tk{padding:8px;border-top-width:8px}.tk .hd b{font-size:19px;white-space:nowrap}.tk .tm{font-size:20px}.tk .li{font-size:15px;padding:4px 0}.tk .li small{font-size:12px}
.tk button{min-height:58px;font-size:19px;margin-top:6px}
.kt button,.svbtn{min-height:40px;font-size:14px;padding:0 12px}
.vb{padding:6px 10px;font-size:14px;margin-bottom:6px}.vb button{min-height:36px}
.pstrip{background:var(--red);color:#fff;border-radius:10px;padding:6px 10px;margin-bottom:8px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.pstrip .sp{flex:1}.pstrip button{background:#fff;color:var(--red);min-height:34px;padding:0 12px}
/* bill */
.bl2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
@media(max-width:760px){.bl2{grid-template-columns:1fr}}
.bl2 .col{min-width:0}
.pin-foot{position:sticky;bottom:0;background:#fff;padding:8px 0 2px;margin-top:8px;border-top:1px solid var(--line)}
.bill-total{font-size:30px;font-weight:800}
.chg{font-size:28px;font-weight:800;color:var(--green)}
.sel2{display:flex;gap:8px;align-items:center;margin:6px 0}.sel2 label{flex:1;font-size:13px;color:var(--mute)}
select{font:inherit;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;color:var(--ink);width:100%}
.pin3{display:flex;gap:8px}.pin3>*{flex:1;min-width:0}
</style></head>
<body>
<div id="app"></div><div id="pttbar"></div><div id="recov"></div><div id="vmsg"></div><div id="alerts"></div><div id="modal"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
'use strict';
const API = '../api/';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso = n => '₱' + Number(n || 0).toLocaleString('en-PH');
function ls(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; }
}
function jparse(s) { try { return JSON.parse(s); } catch (e) { return null; } }

const S = { token: ls('bpk_token'), user: jparse(ls('bpk_user')), menu: null, tab: null, view: 'login',
  tables: [], order: null, cmp: null, online: true, timers: [15, 25, 35, 45], busy: {} };

async function api(path, method, body) {
  method = method || 'GET';
  try {
    const r = await fetch(API + path, { method, headers: Object.assign({ 'Content-Type': 'application/json' }, S.token ? { Authorization: 'Bearer ' + S.token } : {}), body: body ? JSON.stringify(body) : undefined });
    let d = {}; try { d = await r.json(); } catch (e) {}
    setOnline(true);
    if (r.status === 401 && S.token) { doLogout(true); }
    return { ok: r.ok, status: r.status, data: d };
  } catch (e) { setOnline(false); return { ok: false, status: 0, data: { error: 'network' } }; }
}
function setOnline(v) { if (S.online !== v) { S.online = v; const d = $('.dot'); if (d) d.className = 'dot' + (v ? '' : ' off'); } }
function toast(t, ms) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', ms || 2600); }
function modal(html) { const m = $('#modal'); m.innerHTML = '<div class="sheet">' + html + '</div>'; m.classList.add('show'); }
function closeModal() { const m = $('#modal'); m.classList.remove('show'); m.innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

// ---------- sound / vibration / screen on ----------
let AC;
function unlock() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
function tone(f, d, when, vol, type) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.value = f;
  o.connect(g); g.connect(AC.destination); const t = AC.currentTime + (when || 0);
  g.gain.setValueAtTime(vol || .3, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.start(t); o.stop(t + d + .03);
}
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function chime() { tone(880, .25, 0); tone(1175, .4, .28); buzz([200, 100, 200]); }
function ding() { tone(660, .2, 0, .25); buzz(120); }
function siren() { for (let i = 0; i < 3; i++) { tone(950, .18, i * .4, .5, 'square'); tone(650, .18, i * .4 + .2, .5, 'square'); } buzz([400, 150, 400]); }
document.addEventListener('pointerdown', unlock);
let wake;
async function keepAwake() { try { if (navigator.wakeLock && S.token) wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

// ---------- login ----------
async function showLogin() {
  S.view = 'login'; document.body.className = '';
  $('#app').innerHTML = '<div class="main"><div class="pad login"><h1>Blue Platter Kitchenette</h1><p>Who are you?</p><div class="names" id="names"><p class="mute">Loading…</p></div><p style="margin-top:24px"><a href="../admin/">Owner / admin login</a></p></div></div>';
  const r = await api('staff-names');
  if (!r.ok) { $('#names').innerHTML = '<p class="err">Cannot reach the server. Check the internet.</p><button data-act="relogin">Try again</button>'; return; }
  S.names = r.data.staff;
  $('#names').innerHTML = S.names.map(s => `<button data-act="pick" data-id="${s.id}">${esc(s.name)}<small>${esc(s.role)}</small></button>`).join('');
}
function showPin(id) {
  const s = S.names.find(x => x.id == id); S.pin = ''; S.pickId = id;
  $('#app').innerHTML = `<div class="main"><div class="pad login"><h1>${esc(s.name)}</h1><p>Enter your PIN</p><div class="dots" id="dots"></div><div class="err" id="perr"></div>
  <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-act="key" data-k="${n}">${n}</button>`).join('')}<button data-act="relogin" class="gray" style="font-size:16px">Back</button><button data-act="key" data-k="0">0</button><button data-act="key" data-k="del" class="gray">⌫</button></div>
  <button data-act="pinok" style="width:100%;margin-top:12px;min-height:56px">OK</button></div></div>`;
  drawDots();
}
function drawDots() { const d = $('#dots'); if (d) d.innerHTML = Array.from({ length: 6 }, (_, i) => `<i class="${i < S.pin.length ? 'f' : ''}"></i>`).join(''); }
async function submitPin() {
  if (S.pin.length < 4) return;
  const r = await api('login', 'POST', { staff_id: S.pickId, secret: S.pin, device: (navigator.userAgent || '').slice(0, 60) });
  if (!r.ok) { S.pin = ''; drawDots(); const e = $('#perr'); if (e) e.textContent = r.status === 0 ? 'No connection.' : (r.status === 429 ? 'Too many tries. Wait 10 minutes.' : r.status === 401 ? 'Wrong PIN.' : 'Server problem (' + r.status + '). Tell Mark.'); return; }
  S.token = r.data.token; S.user = r.data.user; ls('bpk_token', S.token); ls('bpk_user', JSON.stringify(S.user));
  startApp();
}
function doLogout(silent) {
  if (!silent && S.token) api('logout', 'POST');
  S.token = null; S.user = null; ls('bpk_token', null); ls('bpk_user', null);
  stopSiren(); $('#alerts').innerHTML = ''; $('#vmsg').innerHTML = ''; $('#pttbar').style.display = 'none'; PTT.last = null; closeModal(); showLogin();
}

// ---------- app shell ----------
const TABS = { waiter: [['tables', 'Tables'], ['takeout', 'Take-out / Delivery'], ['reservations', 'Reservations']], cashier: [['cashier', 'Orders'], ['online', 'Online'], ['tables', 'Tables'], ['takeout', 'Take-out'], ['reservations', 'Reservations'], ['members', 'Members'], ['today', 'Today']], kitchen: [['kitchen', 'Kitchen']],
  admin: [['tables', 'Tables'], ['takeout', 'Take-out'], ['kitchen', 'Kitchen'], ['cashier', 'Orders'], ['online', 'Online'], ['reservations', 'Reservations'], ['members', 'Members'], ['today', 'Today']] };
async function startApp() {
  keepAwake(); initPtt();
  const m = await api('menu'); if (m.ok) S.menu = m.data;
  const g = await api('group-meals'); if (g.ok) S.group = g.data;
  const tabs = TABS[S.user.role] || TABS.waiter;
  setTab(tabs[0][0]);
}
function shell(inner) {
  const tabs = TABS[S.user.role] || [];
  $('#app').innerHTML = `<div class="top"><b>BPK</b><span class="dot ${S.online ? '' : 'off'}"></span>${tabs.length > 1 ? tabs.map(t => `<button data-act="tab" data-t="${t[0]}" class="${S.tab === t[0] ? 'on' : ''}">${t[1]}</button>`).join('') : ''}<span class="sp"></span>${window.BPKNative ? '<button data-act="prsetup">Printers</button>' : ''}${window.BPKNative && ['cashier', 'admin'].includes(S.user.role) ? `<button data-act="smstoggle" class="${smsOn() ? '' : 'gray'}">Texts: ${smsOn() ? 'ON' : 'OFF'}</button>` : ''}${S.user.role === 'admin' ? '<a href="../admin/" style="color:#fff;font-size:14px">Admin</a>' : ''}<span style="font-size:14px">${esc(S.user.name)}</span><button data-act="logout">Log out</button></div><div id="pbanner"></div><div class="main" id="main">${inner}</div>`;
}
function setTab(t) {
  vStop();
  S.tab = t; S.view = t; document.body.className = t === 'kitchen' ? 'kitchen' : '';
  if (t === 'tables') { shell('<div style="margin-bottom:10px"><button class="sec" data-act="scanvoucher">📷 Scan member voucher</button></div><div class="grid" id="tg"></div>'); renderTables(); pollTables(); }
  else if (t === 'takeout') { shell('<button data-act="newtk" style="width:100%">+ New take-out / delivery order</button><div id="tkl" style="margin-top:12px"></div>'); pollTakeout(); }
  else if (t === 'kitchen') { shell('<div class="kt"><b style="font-size:20px">Kitchen</b><span id="svst" class="sub"></span><span class="sp"></span><button class="gray" data-act="stockmodal">Out of stock</button><button class="svbtn" data-act="service">🔔 SERVICE</button></div><div id="vb"></div><div class="kb" id="kb"></div>'); S.kseen = null; pollKitchen(); }
  else if (t === 'cashier') { shell('<div id="col"></div>'); pollCashier(); }
  else if (t === 'online') { shell('<div id="onl"></div>'); pollOnline(); }
  else if (t === 'reservations') { shell('<button data-act="newres" style="width:100%">+ New reservation</button><div id="resl" style="margin-top:12px"></div>'); loadRes(); }
  else if (t === 'members') { shell(`<div class="card"><b>Scan or type the member's voucher code</b><div class="row" style="margin-top:8px"><input id="vc" placeholder="5-character code under the QR" autocapitalize="characters" style="text-transform:uppercase"><button data-act="vresolve">Check</button></div><div class="btns"><button class="sec" data-act="vscan">📷 Scan the QR code</button></div><video id="vvid" playsinline style="display:none;width:100%;border-radius:12px;margin-top:8px"></video><div id="vres"></div></div>
    <div class="card"><b>Find a member</b><div class="row" style="margin-top:8px"><input id="mq" placeholder="Name or mobile number (3 letters or more)"><button data-act="msearch">Search</button></div><div id="mres"></div></div>`); }
  else if (t === 'today') { shell('<div id="tdy"></div>'); loadToday(); }
}

// ---------- waiter: tables ----------
async function pollTables() {
  if (S.view !== 'tables' || S.busy.t) return; S.busy.t = 1;
  const r = await api('table-status'); S.busy.t = 0;
  if (r.ok && S.view === 'tables') { S.tables = r.data.tables; renderTables(); }
}
function renderTables() {
  const g = $('#tg'); if (!g) return;
  g.className = 'tg';
  const lg = '<div class="legend" style="grid-column:1/-1"><span><i style="background:#1f9d55"></i>Vacant</span><span><i style="background:#d93025"></i>Taken</span><span><i style="background:#f2c200"></i>Reserved</span><span><i style="background:#f08a00"></i>Reserved + advance order</span></div>';
  g.innerHTML = lg + S.tables.map(t => {
    const busy = !!t.order_id, mine = busy && t.waiter_id == S.user.id, rdy = t.ready_count > 0, rv = !busy && t.reserved;
    const cls = busy ? 'occ' : rv ? (rv.advance ? 'adv' : 'rsv') : 'free';
    const word = busy ? 'TAKEN' : rv ? (rv.advance ? 'RESERVED + ORDER' : 'RESERVED') : 'VACANT';
    const sm = busy ? esc(t.waiter_name || '') + (t.minutes != null ? ' · ' + t.minutes + 'm' : '') + (t.total ? '<br>' + peso(t.total) : '') : rv ? esc(rv.time) + ' · ' + esc(rv.name) + '<br>' + rv.guests + ' pax' : '';
    return `<button class="tb2 ${cls} ${mine ? 'mine' : ''} ${rdy ? 'ready' : ''}" data-act="table" data-id="${t.id}"><span class="n">${esc(t.number)}</span><span class="w">${word}</span><small>${sm}</small><span>${rdy ? '<span class="tag">READY</span> ' : ''}${t.bill_requested ? '<span class="tag">BILL</span>' : ''}</span></button>`;
  }).join('');
}
async function pollTakeout() {
  if (S.view !== 'takeout' || S.busy.k) return; S.busy.k = 1;
  const r = await api('orders'); S.busy.k = 0;
  const el = $('#tkl'); if (!r.ok || !el || S.view !== 'takeout') return;
  const list = r.data.orders.filter(o => o.type !== 'dine_in');
  el.className = 'tiles'; el.innerHTML = list.length ? list.map(o => `<div class="tile" data-act="openorder" data-id="${o.id}"><div class="tt"><b>${o.type === 'delivery' ? 'Delivery' : 'Take-out'} · ${esc(o.customer_name)}</b><span class="tag b">${esc(o.order_no)}</span></div><div class="its">${esc(o.phone)} · ${o.items.filter(i => !i.void_reason).length} items</div><b>${peso(orderTotal(o))}</b></div>`).join('') : '<p class="mute" style="text-align:center">No open take-out or delivery orders.</p>';
}
function orderTotal(o) { return (o.items || []).filter(i => !i.void_reason).reduce((a, i) => a + i.price * i.qty, 0); }

// ---------- order detail ----------
async function openOrder(id) {
  const r = await api('orders/' + id); if (!r.ok) { toast('Could not open the order'); return; }
  S.order = r.data.order; S.view = 'order'; renderOrder();
}
async function refreshOrder() {
  if (S.view !== 'order' || !S.order || S.busy.o) return; S.busy.o = 1;
  const r = await api('orders/' + S.order.id); S.busy.o = 0;
  if (!r.ok || S.view !== 'order' || $('#modal').classList.contains('show')) return;
  if (r.data.order.status !== 'open') { toast('This order is closed.'); goHome(); return; }
  S.order = r.data.order; renderOrder();
}
function goHome() { S.cmp = null; setTab(S.tab); }
function renderOrder() {
  const o = S.order, role = S.user.role, batches = {};
  o.items.forEach(i => (batches[i.batch] = batches[i.batch] || []).push(i));
  const title = o.type === 'dine_in' ? (o.table_number ? 'Table ' + esc(o.table_number) : 'Reservation · ' + esc(o.reservation ? o.reservation.name : '')) : (o.type === 'delivery' ? 'Delivery' : 'Take-out') + ' · ' + esc(o.customer_name);
  const stt = { new: ['NEW', 'g'], cooking: ['COOKING', 'y'], ready: ['READY', ''] };
  $('#main').innerHTML = `<div class="row" style="margin-bottom:10px"><button class="gray" data-act="back">← Back</button><span class="sp"></span><span class="tag b">${esc(o.order_no)}</span></div>
  <div class="card"><div class="row"><h2 class="h2">${title}</h2><span class="sp"></span><b>${peso(orderTotal(o))}</b></div><div class="sub">Waiter: ${esc(o.waiter_name || '')}${o.bill_requested ? ' · <b style="color:#b58900">BILL REQUESTED</b>' : ''}${o.phone ? ' · ' + esc(o.phone) : ''}${o.address ? '<br>' + esc(o.address) : ''}${o.delivery_company ? ' · ' + esc(o.delivery_company) : ''}</div></div>
  ${Object.keys(batches).map(b => `<div class="card"><div class="sub" style="margin-bottom:4px">Round ${b} · sent ${esc((batches[b][0].sent_at || '').slice(11, 16))}</div>${batches[b].map(i => `<div class="line ${i.void_reason ? 'void' : ''}"><div class="row"><b>${i.qty}× ${esc(i.name)}</b><span class="sub">${esc(i.variant_label || '')}</span><span class="sp"></span>${i.kitchen && !i.void_reason ? `<span class="tag ${stt[i.status] ? stt[i.status][1] : 'g'}">${stt[i.status] ? stt[i.status][0] : esc(i.status)}</span>` : ''}</div><div class="sub">${i.rush ? '<b style="color:var(--red)">RUSH</b> ' : ''}${i.allergy ? '<b style="color:var(--red)">ALLERGY</b> ' : ''}${i.take_out ? 'TAKE-OUT ' : ''}${i.seat ? 'Seat ' + esc(i.seat) + ' ' : ''}${esc(i.notes)}${i.void_reason ? ' — void: ' + esc(i.void_reason) : ''}</div>${i.void_reason ? '' : `<button class="gray" style="min-height:36px;margin-top:4px;font-size:13px" data-act="void" data-id="${i.id}">Void</button>`}</div>`).join('')}</div>`).join('')}
  <div class="btns"><button data-act="additems">+ Add items</button><button class="sec" data-act="bill" ${o.bill_requested ? 'disabled' : ''}>Request bill</button>${o.type === 'dine_in' ? '<button class="sec" data-act="move">Move table</button>' : ''}<button class="sec" data-act="handover">Hand over</button>${role === 'cashier' || role === 'admin' ? '<button class="sec" data-act="reprinttk" data-id="' + o.id + '">Reprint kitchen slip</button><button class="green" data-act="paybill" data-id="' + o.id + '">Bill / Pay</button>' : ''}${(role === 'waiter' || role === 'cashier' || role === 'admin') && o.type === 'dine_in' ? '<button class="sec" data-act="scanvoucher" data-id="' + o.id + '">Scan member voucher</button>' : ''}</div>`;
}
function voidModal(id) {
  const it = S.order.items.find(i => i.id == id);
  modal(`<h2 class="h2">Void ${esc(it.name)}</h2><p class="sub">A reason is required.</p>
  <div class="btns" style="margin-top:0">${['Customer changed mind', 'Wrong order', 'Out of stock', 'Too long'].map(r => `<button class="sec" data-act="vreason" data-r="${r}">${r}</button>`).join('')}</div>
  <input id="vr" placeholder="Reason" style="margin-top:10px"><label class="row" style="margin:12px 0"><input type="checkbox" id="vt" style="width:24px;min-height:24px" ${it.kitchen && it.status !== 'ready' ? 'checked' : ''}> Tell the kitchen</label>
  <div class="btns"><button class="gray" data-act="closemodal">Cancel</button><button class="red" data-act="voidgo" data-id="${id}">Void it</button></div>`);
}
async function voidGo(id) {
  const reason = $('#vr').value.trim(); if (!reason) { toast('Please give a reason.'); return; }
  const r = await api('order-items/' + id + '/void', 'POST', { reason, tell_kitchen: $('#vt').checked });
  if (r.ok) { closeModal(); toast('Voided'); openOrder(S.order.id); } else toast('Could not void: ' + (r.data.error || 'error'));
}
async function moveModal() {
  const r = await api('table-status'); if (!r.ok) return;
  modal(`<h2 class="h2">Move to which table?</h2><div class="grid" style="margin-top:10px">${r.data.tables.filter(t => t.id != S.order.table_id).map(t => `<button class="tb ${t.order_id ? 'busy' : ''}" data-act="movego" data-id="${t.id}"><span class="n" style="font-size:24px">${esc(t.number)}</span><small>${t.order_id ? 'merge' : 'free'}</small></button>`).join('')}</div><div class="btns"><button class="gray" data-act="closemodal">Cancel</button></div>`);
}
async function handoverModal() {
  const r = await api('staff-names'); if (!r.ok) return;
  const w = r.data.staff.filter(s => s.role === 'waiter' && s.id != S.order.waiter_id);
  modal(`<h2 class="h2">Hand this order to</h2><div class="btns">${w.length ? w.map(s => `<button data-act="handgo" data-id="${s.id}">${esc(s.name)}</button>`).join('') : '<p class="mute">No other waiter.</p>'}</div><div class="btns"><button class="gray" data-act="closemodal">Cancel</button></div>`);
}

// ---------- compose (menu + cart) ----------
function draftKey(c) { return 'bpk_draft_' + (c.mode === 'res' ? 'r' + c.res_id : c.mode === 'add' ? 'o' + c.order_id : c.type === 'dine_in' ? 't' + c.table_id : 'tk'); }
function saveDraft() { const c = S.cmp; if (!c) return; ls(draftKey(c), c.lines.length ? JSON.stringify({ lines: c.lines, guests: c.guests, cust: c.cust, key: c.key, type: c.type }) : null); }
function newKey() { return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
function startCompose(o) {
  const c = Object.assign({ lines: [], guests: 2, cust: { name: '', phone: '', address: '', company: '' }, key: newKey(), cat: null, q: '' }, o);
  const d = jparse(ls(draftKey(c)));
  if (d && d.lines && d.lines.length) { c.lines = d.lines; c.guests = d.guests || 2; c.cust = d.cust || c.cust; c.key = d.key || c.key; if (d.type && c.mode === 'new' && c.type !== 'dine_in') c.type = d.type; }
  S.cmp = c; S.view = 'compose';
  const cats = (S.menu ? S.menu.categories : []).filter(x => x.active); c.cat = cats.length ? cats[0].id : null;
  renderCompose();
}
function renderCompose() {
  const c = S.cmp, cats = S.menu.categories.filter(x => x.active);
  $('#main').style.padding = '0';
  $('#main').innerHTML = `<div class="cmpwrap"><div class="cmp"><div class="rail" id="rail"></div><div class="mid"><div style="padding:8px;display:flex;gap:8px"><button class="gray" data-act="back" style="min-width:80px">← Back</button><input id="srch" placeholder="Search the menu" value="${esc(c.q)}"></div><div class="items" id="items"></div></div></div><button class="cartbtn" id="cartbtn" data-act="cartopen"></button><div class="cart" id="cart"></div></div>`;
  renderRail(); renderItems(); renderCart();
  $('#srch').addEventListener('input', e => { c.q = e.target.value; renderItems(); });
}
function renderRail() { const c = S.cmp; $('#rail').innerHTML = (S.group && S.group.sets.length ? `<button class="${!c.q && c.cat === 'gm' ? 'on' : ''}" data-act="cat" data-id="gm">★ Group Meals</button>` : '') + S.menu.categories.filter(x => x.active).map(x => `<button class="${!c.q && c.cat === x.id ? 'on' : ''}" data-act="cat" data-id="${x.id}">${esc(x.name)}</button>`).join(''); }
function renderItems() {
  const c = S.cmp, q = c.q.trim().toLowerCase();
  const activeCats = new Set(S.menu.categories.filter(x => x.active).map(x => x.id));
  if (c.cat === 'gm' && !q) {
    $('#items').innerHTML = S.group.sets.map(g => `<button class="it" data-act="gset" data-id="${g.id}"><span>${esc(g.name)} · ${g.persons} pax<div class="sub">Save ${peso(g.savings)}${+g.free_card ? ' · includes 1 free Prestige' : ''}</div></span><span class="p">${peso(g.price)}</span></button>`).join('');
    return;
  }
  const list = S.menu.items.filter(i => i.active && activeCats.has(i.category_id) && (q ? i.name.toLowerCase().includes(q) : i.category_id === c.cat));
  $('#items').innerHTML = list.map(i => {
    const ps = i.variants.map(v => v.price), p = Math.min.apply(null, ps), out = !i.in_stock;
    return `<button class="it ${out ? 'out' : ''}" data-act="item" data-id="${i.id}" ${out ? 'disabled' : ''}>${i.photo ? `<img loading="lazy" src="../${esc(i.photo)}" alt="">` : '<div class="ph">No photo</div>'}${i.badge ? '<span class="tag b bd">' + esc(i.badge) + '</span>' : ''}${out ? '<span class="tag r bd" style="left:auto;right:6px">OUT</span>' : ''}<span class="nm"><b>${esc(i.name)}</b></span><span class="p">${ps.length > 1 ? 'from ' : ''}${peso(p)}</span></button>`;
  }).join('') || '<p class="mute" style="text-align:center;grid-column:1/-1">Nothing here.</p>';
  if (q) renderRail();
}
function cartTotal() { return S.cmp.lines.reduce((a, l) => a + l.price * l.qty, 0); }
function renderCart() {
  const c = S.cmp, el = $('#cart'); if (!el) return;
  const open = el.classList.contains('open');
  const n = c.lines.reduce((a, l) => a + l.qty, 0);
  $('#cartbtn').textContent = n ? `Order: ${n} item${n > 1 ? 's' : ''} · ${peso(cartTotal())}` : 'Order is empty';
  const head = c.mode === 'res' ? `<b class="h2">Advance order</b><div class="sub">${esc(c.res_name)} · goes to the kitchen's Reserved list now</div>` : c.mode === 'add' ? `<b class="h2">Adding to ${c.type === 'dine_in' ? 'Table ' + esc(c.table_number) : 'order'}</b>`
    : c.type === 'dine_in' ? `<div class="row"><b class="h2">Table ${esc(c.table_number)}</b><span class="sp"></span><span class="sub">Guests</span><div class="qty"><button data-act="gdec">−</button><span>${c.guests}</span><button data-act="ginc">+</button></div></div>`
    : `<b class="h2">${c.type === 'delivery' ? 'Delivery' : 'Take-out'}</b><div style="display:grid;gap:6px;margin-top:6px"><input id="cn" placeholder="Customer name" value="${esc(c.cust.name)}"><input id="cp" placeholder="Phone" inputmode="tel" value="${esc(c.cust.phone)}">${c.type === 'delivery' ? `<input id="ca" placeholder="Address" value="${esc(c.cust.address)}"><input id="cc" placeholder="Delivery company / rider" value="${esc(c.cust.company)}">` : ''}</div>`;
  el.innerHTML = `<div class="row" style="padding:8px 10px;border-bottom:1px solid var(--line)"><div style="flex:1">${head}</div><button class="gray cartclose" data-act="cartclose" style="min-height:40px">Hide</button></div>
  <div class="body">${c.lines.map((l, i) => `<div class="line"><div class="row"><div style="flex:1" ${l.group ? '' : 'data-act="editline"'} data-i="${i}"><b>${esc(l.name)}</b> <span class="sub">${esc(l.label)}</span><div class="sub">${l.rush ? '<b style="color:var(--red)">RUSH</b> ' : ''}${l.allergy ? '<b style="color:var(--red)">ALLERGY</b> ' : ''}${l.take_out ? 'TAKE-OUT ' : ''}${l.seat ? 'Seat ' + esc(l.seat) + ' ' : ''}${esc(l.notes)}</div></div><div class="qty"><button data-act="ldec" data-i="${i}">−</button><span>${l.qty}</span>${l.group ? '' : `<button data-act="linc" data-i="${i}">+</button>`}</div></div></div>`).join('') || '<p class="mute" style="text-align:center">Tap dishes to add them.</p>'}</div>
  <div class="foot"><div class="row" style="margin-bottom:8px"><b>Total</b><span class="sp"></span><b style="font-size:20px">${peso(cartTotal())}</b></div><button data-act="send" style="width:100%;min-height:56px" ${n && !c.sending ? '' : 'disabled'}>${c.sending ? 'Sending…' : 'Send to kitchen'}</button></div>`;
  if (open) el.classList.add('open');
  ['cn:name', 'cp:phone', 'ca:address', 'cc:company'].forEach(p => { const [id, k] = p.split(':'), e = $('#' + id); if (e) e.addEventListener('input', ev => { c.cust[k] = ev.target.value; saveDraft(); }); });
  saveDraft();
}
function lineModal(item, idx) {
  const c = S.cmp, ex = idx != null ? c.lines[idx] : null;
  const vsel = ex ? ex.variant_id : item.variants[0].id;
  modal(`<h2 class="h2">${esc(item.name)}</h2>
  ${ex ? `<p class="sub">${esc(ex.label)}</p>` : item.variants.map(v => `<label class="vopt"><input type="radio" name="vv" value="${v.id}" ${v.id === vsel ? 'checked' : ''}><span>${esc(v.label)}${v.pax ? ' <span class="sub">(' + v.pax + ' pax)</span>' : ''}</span><b style="margin-left:auto">${peso(v.price)}</b></label>`).join('')}
  <div class="row" style="margin:8px 0"><b>Quantity</b><span class="sp"></span><div class="qty"><button data-act="mq" data-d="-1">−</button><span id="mqn">${ex ? ex.qty : 1}</span><button data-act="mq" data-d="1">+</button></div></div>
  <div class="chk"><label><input type="checkbox" id="mrush" ${ex && ex.rush ? 'checked' : ''}><span>RUSH</span></label><label><input type="checkbox" id="mall" ${ex && ex.allergy ? 'checked' : ''}><span>ALLERGY</span></label><label><input type="checkbox" id="mto" ${ex && ex.take_out ? 'checked' : ''}><span>TAKE-OUT</span></label></div>
  <input id="mseat" placeholder="Seat (optional, e.g. 1 or A)" value="${esc(ex ? ex.seat : '')}" style="margin-bottom:8px"><input id="mnote" placeholder="Notes for the kitchen (e.g. no onion)" value="${esc(ex ? ex.notes : '')}">
  <div class="btns"><button class="gray" data-act="closemodal">Cancel</button>${ex ? `<button class="red" data-act="ldel" data-i="${idx}">Remove</button>` : ''}<button data-act="mok" data-id="${item.id}" data-i="${idx == null ? '' : idx}">${ex ? 'Save' : 'Add to order'}</button></div>`);
}
function modalOk(itemId, idx) {
  const c = S.cmp, item = S.menu.items.find(i => i.id == itemId), qty = parseInt($('#mqn').textContent, 10) || 1;
  const f = { qty, rush: $('#mrush').checked, allergy: $('#mall').checked, take_out: $('#mto').checked, seat: $('#mseat').value.trim(), notes: $('#mnote').value.trim() };
  if (idx !== '' && idx != null) Object.assign(c.lines[+idx], f);
  else { const r = document.querySelector('input[name=vv]:checked'), v = item.variants.find(x => x.id == (r ? r.value : item.variants[0].id)); c.lines.push(Object.assign({ variant_id: v.id, item_id: item.id, name: item.name, label: v.label, price: v.price }, f)); }
  closeModal(); renderCart(); toast('Added: ' + item.name, 900);
}
function groupModal(setId) {
  const g = S.group, set = g.sets.find(x => x.id == setId), pos = g.sets.findIndex(x => x.id == setId) + 1;
  modal(`<h2 class="h2">${esc(set.name)} · ${set.persons} pax · ${peso(set.price)}</h2><p class="sub">Choose one for every group below. Group Meals cannot be combined with discounts.</p>
  ${g.portions.map((p, pi) => `<div class="card" style="margin-top:8px"><b>${esc(p.category)}</b> <span class="tag b">${esc(p['p' + pos])}</span><div class="sub">${esc(p.choice)}</div>${g.options.filter(o => o.category === p.category).map(o => `<label class="vopt" style="margin:6px 0 0"><input type="radio" name="gp${pi}" value="${o.id}"><span>${esc(o.name)}</span>${+o['addon' + pos] ? `<b style="margin-left:auto">+${peso(o['addon' + pos])}</b>` : ''}</label>`).join('')}</div>`).join('')}
  <input id="gnote" placeholder="Notes for the kitchen (optional)" style="margin-top:10px">
  <div class="btns"><button class="gray" data-act="closemodal">Cancel</button><button data-act="gok" data-id="${set.id}">Add to order</button></div>`);
}
function groupOk(setId) {
  const g = S.group, set = g.sets.find(x => x.id == setId), pos = g.sets.findIndex(x => x.id == setId) + 1, picks = {}; let total = +set.price;
  for (let i = 0; i < g.portions.length; i++) {
    const p = g.portions[i], r = document.querySelector('input[name=gp' + i + ']:checked');
    if (!r) { toast('Please choose: ' + p.category); return; }
    picks[p.category] = +r.value; total += +g.options.find(o => o.id == r.value)['addon' + pos] || 0;
  }
  S.cmp.lines.push({ group: { set_id: set.id, picks }, name: 'Group Meal ' + set.name, label: set.persons + ' pax', price: total, qty: 1, notes: $('#gnote').value.trim(), seat: '', take_out: false, rush: false, allergy: false });
  closeModal(); renderCart(); toast('Added: Group Meal ' + set.name, 1200);
}
async function sendCmp() {
  const c = S.cmp; if (!c.lines.length || c.sending) return;
  if (c.type !== 'dine_in' && c.mode === 'new') {
    if (!c.cust.name.trim() || !c.cust.phone.trim()) { toast('Please enter the customer name and phone.'); return; }
    if (c.type === 'delivery' && (!c.cust.address.trim() || !c.cust.company.trim())) { toast('Delivery needs an address and a delivery company.'); return; }
  }
  c.sending = true; renderCart();
  const items = c.lines.map(l => l.group ? { group: l.group, notes: l.notes } : ({ variant_id: l.variant_id, qty: l.qty, notes: l.notes, seat: l.seat, take_out: l.take_out ? 1 : 0, rush: l.rush ? 1 : 0, allergy: l.allergy ? 1 : 0 }));
  const r = c.mode === 'res' ? await api('reservations/' + c.res_id + '/order', 'POST', { client_key: c.key, items })
    : c.mode === 'add' ? await api('orders/' + c.order_id + '/items', 'POST', { client_key: c.key, items })
    : await api('orders', 'POST', { reservation_id: c.reservation_id || undefined, type: c.type, table_id: c.table_id || null, guests: c.guests, customer_name: c.cust.name, phone: c.cust.phone, address: c.cust.address, delivery_company: c.cust.company, client_key: c.key, items });
  c.sending = false;
  if (r.ok) { ls(draftKey(c), null); $('#main').style.padding = ''; toast('Sent to the kitchen'); const id = r.data.order && r.data.order.id; S.cmp = null; if (c.mode === 'new' && c.type === 'dine_in' && id) { openOrder(id); } else goHome(); }
  else if (r.data.error === 'table_busy') { ls(draftKey(c), null); $('#main').style.padding = ''; toast('That table was just taken by someone else.'); S.cmp = null; goHome(); }
  else if (r.data.error === 'out_of_stock') { toast((r.data.detail || 'A dish') + ' is out of stock. Remove it and send again.', 4000); refreshMenu(); renderCart(); }
  else if (r.status === 0) { toast('No connection. Tap Send again. It will not be sent twice.', 4000); renderCart(); }
  else { toast('Could not send: ' + (r.data.error || 'error'), 4000); renderCart(); }
}

// ---------- printing from this tablet (Android app only) ----------
const PR = { busy: false, wait: null, n: 0 };
function prMap() { try { return JSON.parse(localStorage.getItem('bpk_pmap') || '{}'); } catch (e) { return {}; } }
async function printLoop() {
  if (PR.busy || !S.token || !window.BPKNative || S.user.role === 'rider') return; const map = prMap(), ids = Object.keys(map).filter(k => map[k]); if (!ids.length) return; PR.busy = true;
  try {
    const r = await api('print/pending?ids=' + ids.join(',')); if (!r.ok || !r.data.jobs.length) return; const j = r.data.jobs[0];
    const res = await new Promise(resolve => { const t = setTimeout(() => resolve({ ok: false, error: 'printer did not answer' }), 40000); PR.wait = { id: j.id, done: v => { clearTimeout(t); resolve(v); } }; BPKNative.printDoc(String(j.id), map[j.printer_id], j.paper_mm, JSON.stringify(j.doc)); });
    PR.wait = null; await api('print/' + j.id + '/result', 'POST', res);

}

// ---------- texts sent from this tablet's SIM (Android app only) ----------
const SMS = { busy: false, wait: null };
function smsOn() { try { return localStorage.getItem('bpk_sms') === '1'; } catch (e) { return false; } }
window.onNative = o => { if (o && o.type === 'printjob' && PR.wait) { const [id, err] = String(o.message || '').split('|'); if (+id === PR.wait.id) PR.wait.done({ ok: !!o.ok, error: err || '' }); } else if (o && o.type === 'sms' && SMS.wait) { const [id, err] = String(o.message || '').split('|'); if (+id === SMS.wait.id) SMS.wait.done({ ok: !!o.ok, error: err || '' }); } else if (o && o.type === 'sms_permission') toast(o.ok ? 'Text permission granted.' : 'Text permission was not granted.', 3500); };
async function smsLoop() {
  if (SMS.busy || !S.token || !window.BPKNative || !['cashier', 'admin'].includes(S.user.role) || !smsOn()) return; SMS.busy = true;
  try {
    if (!BPKNative.smsReady()) { BPKNative.smsRequest(); return; }
    const r = await api('sms/pending?limit=1'); if (!r.ok || !r.data.messages.length) return;
    const m = r.data.messages[0];
    const res = await new Promise(resolve => { const t = setTimeout(() => resolve({ ok: false, error: 'no answer from phone' }), 45000); SMS.wait = { id: m.id, done: v => { clearTimeout(t); resolve(v); } }; BPKNative.sendSms(String(m.id), m.phone, m.body); });
    SMS.wait = null; await api('sms/' + m.id + '/result', 'POST', res);
    await new Promise(r2 => setTimeout(r2, (r.data.gap || 4) * 1000));
  } catch (e) {} finally { SMS.busy = false; }
}
setInterval(smsLoop, 3000);

// ---------- cashier: online orders ----------
const ONLINE = { list: [], seen: null, low: {} };
async function pollOnline() {
  if (!S.token || !['cashier', 'admin'].includes(S.user.role) || S.busy.o) return; S.busy.o = 1;
  const r = await api('online/pending'); S.busy.o = 0; if (!r.ok) return;
  const now = Date.now(); r.data.orders.forEach(o => o.deadline = now + o.seconds_left * 1000); ONLINE.list = r.data.orders;
  const ids = ONLINE.list.map(o => o.id); if (ONLINE.seen && ids.some(i => !ONLINE.seen.includes(i))) { chime(); setTimeout(chime, 900); } ONLINE.seen = ids;
  const bt = document.querySelector('button[data-t=online]'); if (bt) bt.textContent = 'Online' + (ids.length ? ' (' + ids.length + ')' : '');
  if (S.view === 'online') renderOnline();
}
function onlineLeft(o) { return Math.max(0, Math.round((o.deadline - Date.now()) / 1000)); }

    <div class="sub">📞 ${esc(o.phone)}${o.type === 'delivery' ? ' · ' + esc(o.address) + (o.landmark ? ' (' + esc(o.landmark) + ')' : '') : ''}${o.note ? ' · Note: ' + esc(o.note) : ''}</div>
    ${o.items.map(i => `<div class="line row"><span style="flex:1">${i.qty}× ${esc(i.name)} <span class="sub">${esc(i.label)}</span></span><b>${peso(i.price * i.qty)}</b><button class="gray" style="min-height:36px;padding:0 10px" data-act="onless" data-oid="${o.id}" data-line="${i.id}" data-qty="${i.qty}">${i.qty > 1 ? '−1' : 'Remove'}</button></div>`).join('')}
    <div class="row line"><b>Total</b><span class="sp"></span><b style="font-size:20px">${peso(o.total)}</b></div>
    <div class="sub">Payment: <b>${o.pay_method === 'gcash' ? 'GCash · ref ' + esc(o.pay_ref) : 'Cash'}</b>${o.has_shot ? '' : (o.pay_method === 'gcash' ? ' · no screenshot yet' : '')}</div>
    <div class="btns">${o.has_shot ? `<button class="sec" data-act="onshot" data-id="${o.id}">View screenshot</button>` : ''}<button class="red" data-act="oncancel" data-id="${o.id}">Cancel</button><button class="green" data-act="onaccept" data-id="${o.id}">Accept</button></div></div>`).join('') || '<p class="mute" style="text-align:center">No online orders waiting.</p>';

    e.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0') + ' left'; e.className = 'tag oleft ' + (sec <= 300 ? 'r' : 'y');

async function onlineAct(id, act) {
  let body = {};

  else { const why = prompt('Reason for cancelling (the customer will see it):'); if (!why || !why.trim()) { toast('A reason is required.'); return; } body = { reason: why.trim() }; }
  const r = await api('online/' + id + '/' + act, 'POST', body);
  if (r.ok) { toast(act === 'accept' ? 'Accepted. It is in the kitchen.' : 'Cancelled.'); pollOnline(); }

}

// ---------- alerts: ready food + service ----------

  if (!S.token || S.user.role === 'kitchen' || S.busy.a) return; S.busy.a = 1;
  const [a, sv] = await Promise.all([api('my-alerts'), api('service-calls')]); S.busy.a = 0;
  if (a.ok) {
    const groups = {}; a.data.ready.forEach(i => { const g = groups[i.order_id] = groups[i.order_id] || { t: i.table_number ? 'Table ' + i.table_number : i.order_no, items: [], ids: [] }; g.items.push(i.qty + '× ' + i.name); g.ids.push(i.id); });
    const ids = a.data.ready.map(i => i.id), fresh = ids.some(i => !(S.ralert || []).includes(i)); S.ralert = ids;
    if (fresh) chime();
    $('#alerts').innerHTML = Object.keys(groups).map(k => `<div class="banner"><div><b>${esc(groups[k].t)} — food is ready</b><div>${esc(groups[k].items.join(', '))}</div></div><span class="sp"></span><button data-act="seen" data-ids="${groups[k].ids.join(',')}">OK</button></div>`).join('');

function showSvc(c) {

async function pttStart(e) {

  PTT.holding = true; PTT.cancel = false; PTT.lock = false; PTT.sx = e.clientX; PTT.sy = e.clientY;

  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  const mt = (window.MediaRecorder && types.find(t => MediaRecorder.isTypeSupported(t))) || '';

  PTT.chunks = []; PTT.rec = new MediaRecorder(PTT.stream, mt ? { mimeType: mt } : {});
  PTT.rec.ondataavailable = ev => { if (ev.data && ev.data.size) PTT.chunks.push(ev.data); };
  PTT.rec.onstop = pttFinish; PTT.rec.start(); PTT.t0 = Date.now(); ding();

  PTT.timer = setInterval(() => { drawRec(); if (Date.now() - PTT.t0 >= 60000) pttStop(false); }, 250);
}

    : `<b>● ${sec}s</b>${PTT.cancel ? '<span style="color:#ffb4ab">Release to cancel</span>' : 'Release to send<br><small>Slide left to cancel · slide up to lock</small>'}`;
}

  if (S.user.role === 'kitchen') { PTT.target = { id: m.from_id, name: m.from_name }; drawPtt(); }
  const box = $('#vmsg'), d = document.createElement('div');
  d.innerHTML = `<div style="flex:1"><b>${esc(m.from_name)}</b>${m.table_label ? ' · ' + esc(m.table_label) : ''}<div>${m.kind === 'text' ? esc(m.text) : '🔊 Voice message · ' + m.dur + 's'}</div></div>${m.kind === 'voice' ? '<button data-act="replay" data-id="' + m.id + '">▶</button>' : ''}<button class="gray" data-act="vdismiss">OK</button>`;
  box.append(d); setTimeout(() => d.remove(), 25000);
  while (box.children.length > 3) box.firstChild.remove();
  if (m.kind === 'voice') setTimeout(async () => { const ok = await playClip(m.id); if (!ok) toast('Tap ▶ to hear the message.', 3000); }, 700);
}
function quickModal() {
  const list = QUICK[S.user.role];
  modal(`<h2 class="h2">Quick message${S.user.role === 'kitchen' ? ' to ' + esc(PTT.target ? PTT.target.name : '') : ' to the kitchen'}</h2><div class="btns" style="flex-direction:column">${list.map(t => `<button data-act="qsend" data-t="${esc(t)}" style="min-height:56px">${esc(t)}</button>`).join('')}</div><div class="btns"><button class="gray" data-act="closemodal">Close</button></div>`);
}

// ---------- main loop ----------
setInterval(() => {
  if (!S.token) return;
  if (S.view === 'tables') pollTables(); else if (S.view === 'takeout') pollTakeout(); else if (S.view === 'order') refreshOrder();
  else if (S.view === 'kitchen') pollKitchen(); else if (S.view === 'cashier') pollCashier();
  pollAlerts(); pollVoice(); pollOnline();
}, 2000);
setInterval(() => { if (S.token && S.view !== 'compose') refreshMenu(); }, 30000);

if (S.token && S.user) { api('me').then(r => { if (r.ok) { S.user = r.data.user; startApp(); } else showLogin(); }); } else showLogin();
</script></body></html>
