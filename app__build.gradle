plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bpk.staff'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bpk.staff'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '0.5.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
